<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPanic AI Learn 🚀</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
radial-gradient(circle at top left,#38bdf830,transparent 25%),
radial-gradient(circle at bottom right,#6366f130,transparent 25%),
#020617;

color:white;
min-height:100vh;
overflow-x:hidden;

}

/* HEADER */

.header{

padding:20px 8%;

display:flex;
justify-content:space-between;
align-items:center;

background:rgba(255,255,255,0.05);

backdrop-filter:blur(20px);

border-bottom:1px solid rgba(255,255,255,0.08);

}

.logo{

font-size:26px;
font-weight:700;
color:#38bdf8;

}

/* HERO */

.hero{

width:90%;
max-width:1200px;

margin:auto;
margin-top:35px;

padding:40px;

border-radius:28px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

box-shadow:
0 0 40px rgba(56,189,248,0.15);

}

.hero h1{

font-size:48px;
line-height:1.4;

}

.hero span{
color:#38bdf8;
}

.hero p{

margin-top:12px;
opacity:0.8;
line-height:1.8;

}

/* MAIN */

.container{

width:90%;
max-width:1200px;

margin:auto;
margin-top:30px;

display:grid;
grid-template-columns:350px 1fr;

gap:25px;

}

/* CARD */

.card{

background:rgba(255,255,255,0.05);

padding:25px;

border-radius:24px;

border:1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

}

/* INPUTS */

input,select{

width:100%;

padding:14px;

margin-top:14px;

border:none;
outline:none;

border-radius:14px;

background:#111827;

color:white;

font-size:15px;

}

/* BUTTON */

button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:14px;

background:linear-gradient(
45deg,
#38bdf8,
#6366f1
);

color:white;

font-weight:700;

cursor:pointer;

transition:0.3s;

}

button:hover{

transform:translateY(-2px);

box-shadow:
0 0 25px rgba(56,189,248,0.35);

}

/* OUTPUT */

.output{

background:#0f172a;

padding:25px;

border-radius:22px;

min-height:550px;

line-height:1.9;

border:1px solid rgba(255,255,255,0.06);

overflow:auto;

}

/* TEXTBOOK STYLE */

.output h1,
.output h2,
.output h3{

color:#38bdf8;

margin-top:18px;
margin-bottom:10px;

}

.output p{

margin-top:10px;

color:#e2e8f0;

}

/* LOADER */

.loader{

display:none;

color:#38bdf8;

font-weight:600;

margin-bottom:12px;

}

/* MOBILE */

@media(max-width:950px){

.container{
grid-template-columns:1fr;
}

.hero h1{
font-size:34px;
}

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">
🚀 ExamPanic AI Learn
</div>

</div>

<!-- HERO -->

<div class="hero">

<h1>
Learn Any Chapter With <span>AI Teacher</span> 📚
</h1>

<p>

Deep chapter explanation for ICSE students in
Hindi & English with examples, revision and
interactive learning.

</p>

</div>

<!-- MAIN -->

<div class="container">

<!-- LEFT -->

<div class="card">

<h2>📘 Start Learning</h2>

<select id="cls">

<option value="">Class</option>

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>

</select>

<input id="subject" placeholder="Subject">

<input id="chapter" placeholder="Chapter">

<select id="lang">

<option value="english">
English
</option>

<option value="hindi">
Hindi
</option>

</select>

<button onclick="startLearning()">

🚀 Start AI Learning

</button>

</div>

<!-- RIGHT -->

<div class="card">

<h2>🧠 AI Teacher Output</h2>

<div class="loader" id="loader">

⚡ AI Teacher is explaining...

</div>

<div id="output" class="output">

Start learning to generate AI lesson 🚀

</div>

</div>

</div>

<script>

const API =
"https://student-learning-system-r6bi.onrender.com";

/* LEARN */

async function startLearning(){

let cls =
document.getElementById("cls").value;

let subject =
document.getElementById("subject").value;

let chapter =
document.getElementById("chapter").value;

let lang =
document.getElementById("lang").value;

if(!cls || !subject || !chapter){

alert("Fill all fields");
return;

}

document.getElementById("loader").style.display =
"block";

document.getElementById("output").innerHTML =
"";

try{

let res = await fetch(API + "/learn",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

student_name:"demo",

student_class:cls,

subject:subject,

chapter:chapter,

language:lang

})

});

let data = await res.json();

if(data.status !== "success"){

document.getElementById("output").innerHTML =

"❌ Backend Error";

return;

}

document.getElementById("output").innerHTML =

marked.parse(data.lesson);

}

catch(err){

document.getElementById("output").innerHTML =

"❌ Backend Error";

}

document.getElementById("loader").style.display =
"none";

}

</script>

</body>
</html>
