<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPanic AI Textbook 📚</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
min-height:100vh;
}

/* HEADER */
.header{
padding:20px 8%;
background:rgba(255,255,255,0.05);
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:22px;
font-weight:700;
color:#38bdf8;
}

/* CONTAINER */
.container{
width:90%;
max-width:900px;
margin:auto;
margin-top:25px;
}

/* INPUTS */
input,select{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#111827;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#38bdf8,#6366f1);
color:white;
font-weight:700;
cursor:pointer;
}

/* BOOK STYLE */
.book{
margin-top:25px;
}

.chapter{
background:rgba(255,255,255,0.05);
margin-bottom:12px;
border-radius:14px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.08);
}

.chapter summary{
padding:14px;
cursor:pointer;
color:#38bdf8;
font-weight:600;
background:rgba(255,255,255,0.03);
}

.content{
padding:15px;
line-height:1.8;
color:#e2e8f0;
}

.loader{
display:none;
margin-top:10px;
color:#38bdf8;
}

</style>

</head>

<body>

<div class="header">
<div class="logo">📚 ExamPanic AI Textbook</div>
</div>

<div class="container">

<select id="cls">
<option value="">Class</option>
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option><option>6</option>
<option>7</option><option>8</option><option>9</option><option>10</option>
</select>

<input id="subject" placeholder="Subject">
<input id="chapter" placeholder="Chapter">

<!-- 🌐 LANGUAGE -->
<select id="lang">
<option value="english">English</option>
<option value="hindi">Hindi</option>
</select>

<button onclick="generateNotes()">Generate Notes</button>

<div class="loader" id="loader">⚡ AI is building textbook...</div>

<div class="book" id="book"></div>

</div>

<script>

const API = "https://student-learning-system-r6bi.onrender.com";

async function generateNotes(){

let cls = document.getElementById("cls").value;
let subject = document.getElementById("subject").value;
let chapter = document.getElementById("chapter").value;
let lang = document.getElementById("lang").value;

if(!cls || !subject || !chapter){
alert("Fill all fields");
return;
}

document.getElementById("loader").style.display = "block";

let res = await fetch(API + "/generate-notes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
student_class:cls,
subject:subject,
chapter:chapter,
language:lang   // ✅ IMPORTANT
})
});

let data = await res.json();

document.getElementById("loader").style.display = "none";

renderBook(data.notes || "");
}

/* 📚 TEXTBOOK RENDER */
function renderBook(text){

let parts = text.split(/(?=📘|📌|📖|⭐|🧠|📝)/g);

let html = "";

parts.forEach((p,i)=>{

if(p.trim().length < 5) return;

html += `
<details class="chapter" open>
<summary>📖 Section ${i+1}</summary>
<div class="content">
${marked.parse(p)}
</div>
</details>
`;

});

document.getElementById("book").innerHTML = html;
}

</script>

</body>
</html>
