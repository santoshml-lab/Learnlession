
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPanic AI Teacher 🚀</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
/* SAME CSS (UNCHANGED) */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#38bdf830,transparent 25%),
radial-gradient(circle at bottom right,#6366f130,transparent 25%),
#020617;
min-height:100vh;
color:white;
overflow-x:hidden;
}

.nav{
width:100%;
padding:22px 7%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:28px;
font-weight:700;
color:#38bdf8;
}

.nav-btn{
padding:12px 22px;
border:none;
border-radius:14px;
background:linear-gradient(45deg,#38bdf8,#6366f1);
color:white;
font-weight:600;
cursor:pointer;
}

.hero{
width:90%;
max-width:1400px;
margin:auto;
margin-top:35px;
padding:45px;
border-radius:30px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
box-shadow:0 0 40px rgba(56,189,248,0.15);
}

.hero h1{font-size:55px;}

.hero span{color:#38bdf8;}

.hero p{margin-top:18px;opacity:0.85;}

.main{
width:90%;
max-width:1400px;
margin:auto;
margin-top:30px;
display:grid;
grid-template-columns:380px 1fr;
gap:25px;
}

.card{
background:rgba(255,255,255,0.05);
padding:25px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
}

.sidebar-title{
font-size:26px;
margin-bottom:18px;
color:#38bdf8;
}

input{
width:100%;
padding:14px;
margin-top:14px;
border:none;
outline:none;
border-radius:16px;
background:#111827;
color:white;
font-size:15px;
}

.generate-btn{
width:100%;
padding:15px;
margin-top:18px;
border:none;
border-radius:16px;
background:linear-gradient(45deg,#38bdf8,#6366f1);
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.lesson-output{
background:#0f172a;
padding:25px;
border-radius:22px;
min-height:600px;
border:1px solid rgba(255,255,255,0.06);
line-height:1.9;
}

.lesson-output h1,h2,h3{color:#38bdf8;}

.loader{
display:none;
color:#38bdf8;
font-weight:600;
margin-bottom:10px;
}

@media(max-width:1000px){
.main{grid-template-columns:1fr;}
.hero h1{font-size:38px;}
}
</style>
</head>

<body>

<div class="nav">
<div class="logo">🚀 ExamPanic AI</div>
<button class="nav-btn">AI Teacher</button>
</div>

<div class="hero">

<h1>Your Personal <span>AI Teacher</span><br>for Smart Learning 📚</h1>

<p>
Now learning will be CLASS-BASED (ICSE standard wise explanation)
</p>

</div>

<div class="main">

<div class="card">

<h2 class="sidebar-title">📚 Generate Lesson</h2>

<input type="text" id="studentClass" placeholder="Enter Class (1-10)">
<input type="text" id="subject" placeholder="Enter Subject">
<input type="text" id="chapter" placeholder="Enter Chapter">

<button class="generate-btn" onclick="generateLesson()">
⚡ Generate AI Lesson
</button>

</div>

<div class="card">

<h2>📖 AI Lesson Output</h2>

<div class="loader" id="loader">
⚡ AI is generating lesson...
</div>

<div class="lesson-output" id="lessonBox">
Start learning 🚀
</div>

</div>

</div>

<script>

const API =
"https://student-learning-system-r6bi.onrender.com";

async function generateLesson(){

let cls =
document.getElementById("studentClass").value;

let subject =
document.getElementById("subject").value;

let chapter =
document.getElementById("chapter").value;

if(!cls || !subject || !chapter){
alert("Please fill all fields");
return;
}

document.getElementById("loader").style.display = "block";

try{

let res = await fetch(API + "/learn",{

method:"POST",
headers:{"Content-Type":"application/json"},

body:JSON.stringify({

student_name:"demo",
student_class:cls,
subject:subject,
chapter:chapter

})

});

let data = await res.json();

document.getElementById("lessonBox").innerHTML =
marked.parse(data.lesson || "No lesson generated");

}

catch(err){

document.getElementById("lessonBox").innerHTML =
"❌ Backend Error";

}

document.getElementById("loader").style.display = "none";
}

</script>

</body>
</html>
