
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPanic AI Notes 🚀</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#38bdf830,transparent 25%),
radial-gradient(circle at bottom right,#6366f130,transparent 25%),
#020617;
color:white;
min-height:100vh;
}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 7%;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:26px;
font-weight:700;
color:#38bdf8;
}

/* HERO */
.hero{
padding:35px 7%;
}

.hero h1{
font-size:42px;
line-height:1.3;
}

.hero span{
color:#38bdf8;
}

/* MAIN */
.main{
width:90%;
max-width:1300px;
margin:auto;
display:grid;
grid-template-columns:350px 1fr;
gap:25px;
margin-top:20px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
padding:22px;
border-radius:22px;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
}

/* INPUT */
input,select{
width:100%;
padding:13px;
margin-top:12px;
border:none;
outline:none;
border-radius:14px;
background:#111827;
color:white;
}

/* BUTTON */
.btn{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:14px;
background:linear-gradient(45deg,#38bdf8,#6366f1);
color:white;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.03);
}

/* OUTPUT */
.output{
background:#0f172a;
padding:22px;
border-radius:20px;
min-height:600px;
margin-top:12px;
line-height:1.7;
overflow:auto;
border:1px solid rgba(255,255,255,0.06);
}

/* CONTENT STYLING */
.output h1,
.output h2,
.output h3{
color:#38bdf8;
margin-top:12px;
}

.loader{
display:none;
color:#38bdf8;
font-weight:600;
margin-bottom:10px;
}

/* MOBILE */
@media(max-width:900px){
.main{
grid-template-columns:1fr;
}
.hero h1{
font-size:32px;
}
}

</style>

</head>

<body>

<div class="nav">
<div class="logo">📚 ExamPanic AI Notes</div>
</div>

<div class="hero">
<h1>Generate <span>Smart Exam Notes</span> 🚀</h1>
</div>

<div class="main">

<!-- CONTROL PANEL -->
<div class="card">

<select id="cls">
<option value="">Select Class</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
</select>

<input id="subject" placeholder="Subject">
<input id="chapter" placeholder="Chapter">

<select id="lang">
<option value="english">English</option>
<option value="hindi">Hindi</option>
</select>

<button class="btn" onclick="generateNotes()">Generate Notes</button>
<button class="btn" onclick="downloadPDF()">Download PDF</button>

</div>

<!-- OUTPUT -->
<div class="card">

<h2>📖 Notes Output</h2>

<div class="loader" id="loader">
⚡ AI is generating notes...
</div>

<div id="notesBox" class="output">
Your notes will appear here...
</div>

</div>

</div>

<script>

const API = "https://student-learning-system-r6bi.onrender.com";
let lastNotes = "";

/* GENERATE */
async function generateNotes(){

let cls = document.getElementById("cls").value;
let subject = document.getElementById("subject").value;
let chapter = document.getElementById("chapter").value;
let lang = document.getElementById("lang").value;

if(!cls || !subject || !chapter){
alert("Fill all fields");
return;
}

document.getElementById("loader").style.display = "block";

try{

let res = await fetch(API + "/generate-notes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
student_name:"demo",
student_class:cls,
subject,
chapter,
language:lang
})
});

let data = await res.json();

if(data.status !== "success"){
document.getElementById("notesBox").innerHTML = "❌ Backend Error";
return;
}

lastNotes = data.notes || "";
document.getElementById("notesBox").innerHTML = marked.parse(lastNotes);

}
catch(e){
document.getElementById("notesBox").innerHTML = "❌ Error";
}
finally{
document.getElementById("loader").style.display = "none";
}

}

/* PDF */
function downloadPDF(){

if(!lastNotes){
alert("No notes found!");
return;
}

const { jsPDF } = window.jspdf;
let doc = new jsPDF();

let lines = lastNotes.split("\n");
let y = 12;

doc.setFontSize(11);

lines.forEach(line => {

if(y > 280){
doc.addPage();
y = 12;
}

doc.text(line, 10, y);
y += 8;

});

doc.save("ExamPanic_Notes.pdf");
}

</script>

</body>
</html>
