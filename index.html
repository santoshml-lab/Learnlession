<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPanic AI Notes 📚</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
min-height:100vh;
}

/* HEADER */
.header{
padding:18px 8%;
background:rgba(255,255,255,0.05);
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:22px;
font-weight:700;
color:#38bdf8;
}

/* CONTAINER */
.container{
width:90%;
max-width:900px;
margin:auto;
margin-top:25px;
}

/* INPUTS */
input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#38bdf8,#6366f1);
color:white;
font-weight:700;
cursor:pointer;
}

/* OUTPUT */
.output{
margin-top:20px;
background:rgba(255,255,255,0.05);
padding:18px;
border-radius:14px;
min-height:300px;
line-height:1.8;
border:1px solid rgba(255,255,255,0.08);
}

/* TEXTBOOK STYLE */
.output h1,
.output h2,
.output h3{
color:#38bdf8;
margin-top:10px;
}

.loader{
display:none;
margin-top:10px;
color:#38bdf8;
}

</style>

</head>

<body>

<div class="header">
<div class="logo">📚 ExamPanic AI Notes</div>
</div>

<div class="container">

<select id="cls">
<option value="">Class</option>
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option><option>6</option>
<option>7</option><option>8</option><option>9</option><option>10</option>
</select>

<input id="subject" placeholder="Subject">
<input id="chapter" placeholder="Chapter">

<select id="lang">
<option value="english">English</option>
<option value="hindi">Hindi</option>
</select>

<button onclick="generateNotes()">Generate Notes</button>

<div class="loader" id="loader">⚡ Generating...</div>

<div id="output" class="output">
Your notes will appear here...
</div>

</div>

<script>

const API = "https://student-learning-system-r6bi.onrender.com";

async function generateNotes(){

let cls = document.getElementById("cls").value;
let subject = document.getElementById("subject").value;
let chapter = document.getElementById("chapter").value;
let lang = document.getElementById("lang").value;

if(!cls || !subject || !chapter){
alert("Fill all fields");
return;
}

document.getElementById("loader").style.display = "block";

try{

let res = await fetch(API + "/generate-notes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
student_class:cls,
subject:subject,
chapter:chapter,
language:lang
})
});

let data = await res.json();

if(!data.notes){
document.getElementById("output").innerHTML = "❌ No notes received";
return;
}

document.getElementById("output").innerHTML =
marked.parse(data.notes);

}
catch(err){
document.getElementById("output").innerHTML = "❌ Backend Error";
}

document.getElementById("loader").style.display = "none";
}

</script>

</body>
</html>
